<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓國藥妝 團購自動匯整系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-32">

  <!-- 頂部大橫幅 -->
  <header class="bg-gradient-to-r from-teal-600 to-cyan-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-8 text-center md:text-left flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="space-y-1">
        <div class="flex items-center justify-center md:justify-start gap-2">
          <span class="text-3xl">🇰🇷</span>
          <span class="bg-white/20 text-xs font-bold px-2 py-0.5 rounded-full">辦公室好物團購</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight mt-1">韓國藥妝熱銷品 智慧登記與自動匯整表</h1>
        <p class="text-sm text-teal-100 max-w-2xl">
          填寫完畢送出後，系統會自動在雲端統計每位訂購人、產品數量及金額，所有人即時可見，主揪可一鍵匯出 Excel。
        </p>
      </div>
      <div class="shrink-0 flex flex-col items-center md:items-end gap-2">
        <button onclick="copyShareLink()" class="bg-white text-teal-700 hover:bg-teal-50 font-bold py-2 px-4 rounded-xl text-xs flex items-center gap-1.5 shadow-sm transition-all">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          複製分享網址
        </button>
        <div class="bg-white/10 px-4 py-1.5 rounded-xl border border-white/10 text-center md:text-right mt-1">
          <p class="text-[10px] text-teal-200 uppercase">當前統計</p>
          <p class="text-sm font-bold"><span id="header-total-people" class="text-amber-300">0</span> 位已登記</p>
        </div>
      </div>
    </div>
  </header>

  <!-- 頁籤切換 -->
  <div class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 flex">
      <button id="tab-order" onclick="switchTab('order')" class="flex-1 py-4 text-center font-bold text-sm border-b-2 border-teal-600 text-teal-600 flex items-center justify-center gap-2 transition-all">
        <i data-lucide="edit-3" class="w-4 h-4"></i>
        我要跟團 (同事填寫區)
      </button>
      <button id="tab-dashboard" onclick="switchTab('dashboard')" class="flex-1 py-4 text-center font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center justify-center gap-2 transition-all">
        <i data-lucide="database" class="w-4 h-4"></i>
        主揪管理後台
        <span id="dashboard-badge" class="bg-teal-100 text-teal-800 text-[11px] px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- Toast 通知 -->
    <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-slate-900 border border-slate-800 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 transition-all">
      <i id="toast-icon" data-lucide="info" class="text-teal-400 w-4 h-4"></i>
      <span id="toast-text">訊息提示</span>
    </div>

    <!-- 同步狀態指示 -->
    <div id="sync-bar" class="hidden mb-4 bg-teal-50 border border-teal-200 rounded-xl px-4 py-2.5 flex items-center gap-2 text-xs font-semibold text-teal-700">
      <i data-lucide="loader-2" class="w-4 h-4 spin text-teal-500"></i>
      <span id="sync-text">正在同步雲端資料…</span>
    </div>

    <!-- 頁面 1：填寫訂單 -->
    <div id="view-order" class="space-y-6">

      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
        <h2 class="text-lg font-bold text-slate-955 flex items-center gap-2">
          <span class="w-6 h-6 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center text-xs font-bold">1</span>
          填寫訂購人資訊
        </h2>
        <div class="max-w-md">
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">您的姓名 / 暱稱 *</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
            <input type="text" id="orderer-name" placeholder="請輸入姓名 (例如：雅婷、陳經理)" class="w-full pl-9 pr-3 py-2.5 border-2 border-slate-200 rounded-xl focus:border-teal-500 focus:outline-none font-medium transition-all text-sm">
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <h2 class="text-lg font-bold text-slate-955 flex items-center gap-2 px-1">
          <span class="w-6 h-6 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center text-xs font-bold">2</span>
          挑選熱門藥妝商品
        </h2>
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>

    </div>

    <!-- 頁面 2：主揪後台 -->
    <div id="view-dashboard" class="hidden space-y-6">

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 bg-teal-50 rounded-xl flex items-center justify-center text-teal-600">
            <i data-lucide="users" class="w-6 h-6"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">總登記人數</p>
            <p id="stat-people" class="text-2xl font-bold text-slate-800">0 人</p>
          </div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 bg-cyan-50 rounded-xl flex items-center justify-center text-cyan-600">
            <i data-lucide="shopping-bag" class="w-6 h-6"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">累計採購件數</p>
            <p id="stat-items" class="text-2xl font-bold text-slate-800">0 件</p>
          </div>
        </div>
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600">
            <i data-lucide="dollar-sign" class="w-6 h-6"></i>
          </div>
          <div>
            <p class="text-xs text-slate-400 font-medium">團購總金額</p>
            <p id="stat-money" class="text-2xl font-extrabold text-teal-600">NT$ 0</p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="space-y-0.5">
            <h3 class="font-extrabold text-slate-900 text-base flex items-center gap-2">
              <i data-lucide="table" class="text-teal-600 w-5 h-5"></i>
              訂購人明細對照表
            </h3>
            <p class="text-xs text-slate-400">已自動整合所有人的訂購項目、數量與金額（雲端即時同步）</p>
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <button onclick="refreshDashboard()" id="refresh-btn" class="flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              重新整理
            </button>
            <button onclick="exportToCSV()" class="flex-1 sm:flex-none bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow transition-all">
              <i data-lucide="download" class="w-4 h-4"></i>
              匯出 Excel (CSV)
            </button>
            <button onclick="clearAllOrders()" class="flex-1 sm:flex-none bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold py-2 px-4 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              清空重置
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="py-3 px-5 font-bold">登記時間</th>
                <th class="py-3 px-5 font-bold">訂購人姓名</th>
                <th class="py-3 px-5 font-bold">選購項目與數量明細</th>
                <th class="py-3 px-5 font-bold text-right">小計金額</th>
                <th class="py-3 px-5 font-bold text-center">操作</th>
              </tr>
            </thead>
            <tbody id="orders-table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-4">
        <h3 class="font-bold text-slate-900 text-base flex items-center gap-2 border-b border-slate-100 pb-3">
          <i data-lucide="bar-chart-3" class="text-teal-600 w-5 h-5"></i>
          各商品採購量累計排行
        </h3>
        <div id="stat-chart-bars" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>
      </div>

    </div>
  </main>

  <!-- 底部懸浮列 -->
  <div id="sticky-bar" class="bg-white border-t border-slate-200 p-4 fixed bottom-0 left-0 right-0 shadow-lg z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="text-left">
        <p class="text-xs text-slate-400">已選 <span id="summary-count" class="font-bold text-teal-600 text-sm">0</span> 件商品</p>
        <p class="text-lg font-bold text-slate-800">總金額 <span id="summary-price" class="text-teal-600 text-xl font-extrabold">NT$ 0</span></p>
      </div>
      <div>
        <button id="submit-btn" onclick="submitOrder()" class="bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-extrabold py-3 px-8 rounded-xl shadow-md flex items-center gap-2 transition-all disabled:bg-slate-300 disabled:cursor-not-allowed">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
          確認送出登記
        </button>
      </div>
    </div>
  </div>

  <script>
    // ── 雲端共用 Blob（所有人寫入同一份資料） ──────────────────
    const BLOB_URL = 'https://jsonblob.com/api/jsonBlob/019e4048-aa27-7a2f-8fe0-f31ca1f13742';

    async function cloudLoad() {
      const r = await fetch(BLOB_URL + '?cb=' + Date.now());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      return { blob: data, orders: data.pharmacyOrders || [] };
    }

    async function cloudSave(orders) {
      const { blob } = await cloudLoad();
      blob.pharmacyOrders = orders;
      const r = await fetch(BLOB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(blob)
      });
      if (!r.ok) throw new Error('儲存失敗 HTTP ' + r.status);
    }

    function safeIcons() {
      try { if (typeof lucide !== 'undefined') safeIcons(); } catch(e) {}
    }
    function showSync(msg) {
      document.getElementById('sync-text').textContent = msg;
      document.getElementById('sync-bar').classList.remove('hidden');
    }
    function hideSync() {
      document.getElementById('sync-bar').classList.add('hidden');
    }

    // ── 商品資料 ────────────────────────────────────────────────
    const products = [
      { id:"domina",          name:"Domina Cream 居家皮秒淡斑膏",       tagline:"韓國熱銷 No.1 居家皮秒淡斑神器",            price:1080, color:"zinc",   category:"祛斑保養", note:"請先詢問藥師用法" },
      { id:"reju_green",      name:"熊貓 PDRN 再生霜 🟢 綠",           tagline:"高濃度 PDRN 1500ppm / 清爽凝膠",           price:750,  color:"emerald",category:"日常修復" },
      { id:"reju_blue",       name:"熊貓 PDRN 再生霜 🔵 藍",           tagline:"PDRN 1500ppm + Spicule 微針",              price:850,  color:"blue",   category:"深層修復", note:"敏感肌先小範圍試用" },
      { id:"panda_vita",      name:"熊貓維他命 C 霜 🌙",               tagline:"熬夜人必備！美白提亮去斑",                 price:750,  color:"amber",  category:"美白提亮" },
      { id:"pd3_cream",       name:"Dr.Reju-All PD3 全效霜 💥",        tagline:"PDRN 1200ppm 溫和不刺激，激推",            price:1080, color:"rose",   category:"全效抗老" },
      { id:"reju_lip",        name:"PD3 PDRN 唇部修護精華",            tagline:"改善乾裂角質、重塑水嫩豐唇",              price:550,  color:"pink",   category:"唇部護理" },
      { id:"reju_mask",       name:"高修復 PDRN 煥顏修護面膜",         tagline:"高含量 PDRN 1200ppm 一盒 6 片",            price:880,  color:"indigo", category:"深層面膜" },
      { id:"cica_20",         name:"積雪草外泌體 20 安瓶",             tagline:"【日常修護款】9種胜肽 + EGF 溫和高效",     price:690,  color:"teal",   category:"日常屏障" },
      { id:"cica_50",         name:"積雪草外泌體 50 安瓶 Plus",        tagline:"【高濃度急救款】美白+抗皺雙效",            price:890,  color:"cyan",   category:"術後急救" },
      { id:"juvekle",         name:"Juvekle 童顏霜 🔥 必買",           tagline:"PDLLA 10,625ppm 塗抹式膠原針",             price:1180, color:"violet", category:"局部澎潤" },
      { id:"reju_deep",       name:"Rejuyoung 深層修復霜",             tagline:"10,000ppm 直達真皮層 3 倍高滲透",          price:1080, color:"purple", category:"深層保養" },
      { id:"peridex",         name:"Peridex 葡萄糖營養眼藥水",         tagline:"乾眼人救星！四種清涼度自由選",             price:250,  color:"sky",    category:"眼部護理", note:"備註涼感度：0/1/4/10 度" },
      { id:"rian_pdrn",       name:"Rian PDRN 眼部保濕精華",           tagline:"韓國第一款 PDRN 人工淚液，1次性無防腐劑",  price:499,  color:"blue",   category:"眼部護理" },
      { id:"cearteen",        name:"Cearteen 水楊酸祛痘水",            tagline:"含 2% 水楊酸，對抗悶痘與粉刺",             price:450,  color:"emerald",category:"痘痘急救" },
      { id:"melatoning",      name:"Melatoning Cream 褪黑去斑霜",      tagline:"改善深層黑色素、雀斑與痘疤暗沉",          price:1080, color:"slate",  category:"祛斑保養" },
      { id:"scarnon",         name:"Scarnon Gel 除疤修復凝膠",         tagline:"手術、外傷及燒燙傷疤痕修復",              price:590,  color:"lime",   category:"日常急救", note:"開放傷口勿用" },
      { id:"procalm_k",       name:"Pro Calm Red X CREAM 維生素K霜",   tagline:"專攻退紅消腫、緩解眼袋黑眼圈",            price:450,  color:"purple", category:"眼部護理" },
      { id:"melaxin_retinol", name:"Dr. Melaxin 視黃醇眼袋緊緻霜",     tagline:"脂質體 A 醇成分、專攻眼尾魚尾紋",         price:1080, color:"amber",  category:"眼部護理" }
    ];

    let localQuantities = {};
    let allOrders = [];

    // ── 初始化 ──────────────────────────────────────────────────
    async function init() {
      products.forEach(p => localQuantities[p.id] = 0);
      renderProductCards();
      updateOrderSummary();
      showSync('正在載入雲端訂單資料…');
      try {
        const { orders } = await cloudLoad();
        allOrders = orders;
      } catch(e) {
        allOrders = [];
        showToast('⚠️ 雲端載入失敗，請確認網路：' + e.message, true);
      }
      hideSync();
      updateDashboardUI();
      safeIcons();
    }

    // ── 渲染商品卡片 ────────────────────────────────────────────
    function renderProductCards() {
      const container = document.getElementById('products-container');
      container.innerHTML = '';
      products.forEach(p => {
        const colors = getThemeColors(p.color);
        const card = document.createElement('div');
        card.id = 'card-' + p.id;
        card.className = 'bg-white rounded-2xl p-4 border border-slate-200 hover:border-teal-500 hover:shadow-md transition-all flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${colors.badge}">${p.category}</span>
              <span class="text-xs text-slate-500 font-semibold">NT$ ${p.price.toLocaleString()}</span>
            </div>
            <h3 class="font-extrabold text-slate-900 text-sm md:text-base leading-snug">${p.name}</h3>
            <p class="text-xs font-semibold ${colors.text} mt-0.5">${p.tagline}</p>
            ${p.note ? `<p class="text-[11px] text-amber-600 bg-amber-50 rounded-lg px-2 py-1 mt-2">⚠️ ${p.note}</p>` : ''}
          </div>
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
            <span id="subtotal-${p.id}" class="text-xs font-bold text-teal-600"></span>
            <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
              <button onclick="adjustQty('${p.id}', -1)" class="px-2.5 py-1 text-slate-500 hover:bg-slate-200 active:bg-slate-300 transition-all font-bold text-sm">-</button>
              <input type="number" id="input-${p.id}" value="0" min="0" onchange="setQty('${p.id}', this.value)" class="w-10 text-center bg-transparent text-xs font-bold focus:outline-none py-1 border-x border-slate-200">
              <button onclick="adjustQty('${p.id}', 1)" class="px-2.5 py-1 text-slate-500 hover:bg-slate-200 active:bg-slate-300 transition-all font-bold text-sm">+</button>
            </div>
          </div>`;
        container.appendChild(card);
      });
    }

    window.adjustQty = function(id, val) {
      const input = document.getElementById('input-' + id);
      if (!input) return;
      input.value = Math.max(0, (parseInt(input.value) || 0) + val);
      setQty(id, input.value);
    };

    window.setQty = function(id, val) {
      const v = Math.max(0, parseInt(val) || 0);
      const input = document.getElementById('input-' + id);
      if (input) input.value = v;
      localQuantities[id] = v;
      const p = products.find(x => x.id === id);
      const sub = document.getElementById('subtotal-' + id);
      const card = document.getElementById('card-' + id);
      if (v > 0) {
        if (sub) sub.innerText = '小計: $' + (v * p.price).toLocaleString();
        if (card) card.className = 'bg-white rounded-2xl p-4 border-2 border-teal-500 bg-teal-50/5 shadow-sm flex flex-col justify-between';
      } else {
        if (sub) sub.innerText = '';
        if (card) card.className = 'bg-white rounded-2xl p-4 border border-slate-200 hover:border-teal-500 hover:shadow-md transition-all flex flex-col justify-between';
      }
      updateOrderSummary();
    };

    function updateOrderSummary() {
      let count = 0, price = 0;
      products.forEach(p => { const q = localQuantities[p.id] || 0; count += q; price += q * p.price; });
      document.getElementById('summary-count').innerText = count;
      document.getElementById('summary-price').innerText = 'NT$ ' + price.toLocaleString();
    }

    // ── 送出訂單（雲端儲存） ─────────────────────────────────────
    window.submitOrder = async function() {
      const nameInput = document.getElementById('orderer-name');
      const ordererName = nameInput.value.trim();
      if (!ordererName) {
        showToast('⚠️ 請先輸入步驟 1 的姓名！', true);
        nameInput.focus();
        nameInput.classList.add('ring-2', 'ring-rose-500');
        return;
      }
      nameInput.classList.remove('ring-2', 'ring-rose-500');

      const items = [];
      let totalAmount = 0;
      products.forEach(p => {
        const qty = localQuantities[p.id] || 0;
        if (qty > 0) { items.push({ id:p.id, name:p.name, price:p.price, qty }); totalAmount += qty * p.price; }
      });
      if (items.length === 0) { showToast('⚠️ 尚未選擇任何產品數量！', true); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '⏳ 同步中…';
      showSync('正在將訂單寫入雲端…');

      const now = new Date();
      const ts = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const newOrder = { id:'ord-'+Date.now(), time:ts, name:ordererName, items, total:totalAmount };

      try {
        const { blob, orders } = await cloudLoad();
        orders.unshift(newOrder);
        blob.pharmacyOrders = orders;
        const r = await fetch(BLOB_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(blob) });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        allOrders = orders;
        updateDashboardUI();
        showToast('🎉 登記成功！已即時同步給主揪！', false);

        // 清除表單
        products.forEach(p => {
          localQuantities[p.id] = 0;
          const el = document.getElementById('input-' + p.id);
          if (el) el.value = 0;
          const sub = document.getElementById('subtotal-' + p.id);
          if (sub) sub.innerText = '';
          const card = document.getElementById('card-' + p.id);
          if (card) card.className = 'bg-white rounded-2xl p-4 border border-slate-200 hover:border-teal-500 hover:shadow-md transition-all flex flex-col justify-between';
        });
        nameInput.value = '';
        updateOrderSummary();
        setTimeout(() => switchTab('dashboard'), 500);
      } catch(e) {
        showToast('❌ 送出失敗，請確認網路：' + e.message, true);
      } finally {
        hideSync();
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> 確認送出登記';
        safeIcons();
      }
    };

    // ── 刪除單筆 ────────────────────────────────────────────────
    window.deleteSingleOrder = async function(id) {
      if (!confirm('確定要刪除這筆登記紀錄嗎？')) return;
      showSync('正在刪除並同步雲端…');
      try {
        const { blob, orders } = await cloudLoad();
        blob.pharmacyOrders = orders.filter(o => o.id !== id);
        await fetch(BLOB_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(blob) });
        allOrders = blob.pharmacyOrders;
        updateDashboardUI();
        showToast('🗑️ 紀錄已刪除並同步！', false);
      } catch(e) {
        showToast('❌ 刪除失敗：' + e.message, true);
      } finally { hideSync(); }
    };

    // ── 清空全部 ────────────────────────────────────────────────
    window.clearAllOrders = async function() {
      if (!confirm('⚠️ 警告：這將清除所有雲端登記紀錄！確定嗎？')) return;
      showSync('正在清空雲端資料…');
      try {
        const { blob } = await cloudLoad();
        blob.pharmacyOrders = [];
        await fetch(BLOB_URL, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(blob) });
        allOrders = [];
        updateDashboardUI();
        showToast('🗑️ 已成功重設清空所有登記資料！', false);
      } catch(e) {
        showToast('❌ 清空失敗：' + e.message, true);
      } finally { hideSync(); }
    };

    // ── 重新整理後台 ─────────────────────────────────────────────
    window.refreshDashboard = async function() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      showSync('重新載入最新訂單…');
      try {
        const { orders } = await cloudLoad();
        allOrders = orders;
        updateDashboardUI();
        showToast('✅ 已載入最新資料！', false);
      } catch(e) {
        showToast('❌ 重整失敗：' + e.message, true);
      } finally {
        hideSync();
        btn.disabled = false;
      }
    };

    // ── 後台 UI ─────────────────────────────────────────────────
    function updateDashboardUI() {
      const tableBody = document.getElementById('orders-table-body');
      tableBody.innerHTML = '';
      document.getElementById('header-total-people').innerText = allOrders.length;
      document.getElementById('dashboard-badge').innerText = allOrders.length;
      document.getElementById('stat-people').innerText = allOrders.length + ' 人';

      let totalItems = 0, totalMoney = 0;
      const counts = {};
      products.forEach(p => counts[p.id] = 0);

      if (allOrders.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="py-12 text-center text-slate-400 font-medium">目前尚無任何人提交登記資料</td></tr>';
      } else {
        allOrders.forEach(order => {
          totalMoney += order.total;
          let itemsHTML = '<div class="space-y-1">';
          order.items.forEach(item => {
            totalItems += item.qty;
            if (counts[item.id] !== undefined) counts[item.id] += item.qty;
            itemsHTML += `<div class="flex items-center gap-1.5 text-xs text-slate-700"><span class="bg-teal-100 text-teal-800 px-1.5 py-0.5 rounded font-extrabold text-[10px]">x${item.qty}</span><span class="font-medium">${escapeHTML(item.name)}</span></div>`;
          });
          itemsHTML += '</div>';
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-50 transition-all';
          row.innerHTML = `
            <td class="py-4 px-5 text-xs text-slate-400 font-medium">${order.time}</td>
            <td class="py-4 px-5 font-bold text-slate-800">${escapeHTML(order.name)}</td>
            <td class="py-4 px-5">${itemsHTML}</td>
            <td class="py-4 px-5 text-right font-extrabold text-teal-600 text-sm">NT$ ${order.total.toLocaleString()}</td>
            <td class="py-4 px-5 text-center">
              <button onclick="deleteSingleOrder('${order.id}')" class="text-slate-300 hover:text-rose-600 p-1.5 rounded-lg transition-all">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </td>`;
          tableBody.appendChild(row);
        });
      }

      document.getElementById('stat-items').innerText = totalItems + ' 件';
      document.getElementById('stat-money').innerText = 'NT$ ' + totalMoney.toLocaleString();
      renderChart(counts, totalItems);
      safeIcons();
    }

    function renderChart(counts, grandTotal) {
      const container = document.getElementById('stat-chart-bars');
      container.innerHTML = '';
      if (grandTotal === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 text-xs py-8">暫無統計數據</p>';
        return;
      }
      [...products].sort((a,b) => counts[b.id] - counts[a.id]).forEach(p => {
        const qty = counts[p.id];
        if (qty <= 0) return;
        const pct = Math.round((qty / grandTotal) * 100);
        const colors = getThemeColors(p.color);
        const row = document.createElement('div');
        row.className = 'space-y-1 text-xs';
        row.innerHTML = `
          <div class="flex justify-between items-center font-bold">
            <span class="text-slate-700 truncate max-w-[220px] sm:max-w-md">${p.name}</span>
            <span class="text-slate-500 text-[11px]">${qty} 件 (${pct}%)</span>
          </div>
          <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
            <div class="${colors.bgBar} h-full rounded-full transition-all duration-500" style="width:${pct}%"></div>
          </div>`;
        container.appendChild(row);
      });
    }

    // ── 匯出 CSV ────────────────────────────────────────────────
    window.exportToCSV = function() {
      if (allOrders.length === 0) { showToast('⚠️ 目前沒有任何紀錄可供匯出！', true); return; }
      let csv = '﻿登記時間,訂購人,訂購品項與數量,總小計\n';
      allOrders.forEach(o => {
        const items = o.items.map(i => `[${i.name} x${i.qty}]`).join(' ');
        csv += `"${o.time}","${o.name}","${items}","NT$ ${o.total.toLocaleString()}"\n`;
      });
      const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
      const a = document.createElement('a');
      a.href = url; a.download = `韓國藥妝團購統計表_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      showToast('💾 Excel 檔案 (CSV) 下載成功！', false);
    };

    // ── 頁籤切換 ─────────────────────────────────────────────────
    window.switchTab = function(tabName) {
      const isOrder = tabName === 'order';
      document.getElementById('tab-order').className = `flex-1 py-4 text-center font-bold text-sm border-b-2 ${isOrder ? 'border-teal-600 text-teal-600' : 'border-transparent text-slate-500 hover:text-slate-800'} flex items-center justify-center gap-2 transition-all`;
      document.getElementById('tab-dashboard').className = `flex-1 py-4 text-center font-bold text-sm border-b-2 ${!isOrder ? 'border-teal-600 text-teal-600' : 'border-transparent text-slate-500 hover:text-slate-800'} flex items-center justify-center gap-2 transition-all`;
      document.getElementById('view-order').classList.toggle('hidden', !isOrder);
      document.getElementById('view-dashboard').classList.toggle('hidden', isOrder);
      document.getElementById('sticky-bar').classList.toggle('hidden', !isOrder);
      if (!isOrder) refreshDashboard();
    };

    // ── 複製分享連結 ─────────────────────────────────────────────
    window.copyShareLink = function() {
      const url = window.location.href.split('?')[0];
      navigator.clipboard.writeText(url)
        .then(() => showToast('🔗 網址已複製！直接傳給同事開啟即可登記。', false))
        .catch(() => showToast('🔗 請手動複製網址列的連結', false));
    };

    function showToast(text, isError) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      document.getElementById('toast-text').innerText = text;
      toast.className = `fixed bottom-5 right-5 z-50 ${isError ? 'bg-rose-900 border-rose-800 text-rose-50' : 'bg-slate-900 border-slate-800 text-white'} text-xs font-semibold px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 transition-all`;
      icon.setAttribute('data-lucide', isError ? 'alert-triangle' : 'check-circle');
      safeIcons();
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    function escapeHTML(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function getThemeColors(color) {
      const s = { zinc:{text:'text-zinc-600',badge:'bg-zinc-100 text-zinc-800',bgBar:'bg-zinc-600'}, emerald:{text:'text-emerald-600',badge:'bg-emerald-100 text-emerald-800',bgBar:'bg-emerald-600'}, blue:{text:'text-blue-600',badge:'bg-blue-100 text-blue-800',bgBar:'bg-blue-600'}, amber:{text:'text-amber-600',badge:'bg-amber-100 text-amber-800',bgBar:'bg-amber-600'}, rose:{text:'text-rose-600',badge:'bg-rose-100 text-rose-800',bgBar:'bg-rose-600'}, pink:{text:'text-pink-600',badge:'bg-pink-100 text-pink-800',bgBar:'bg-pink-600'}, indigo:{text:'text-indigo-600',badge:'bg-indigo-100 text-indigo-800',bgBar:'bg-indigo-600'}, teal:{text:'text-teal-600',badge:'bg-teal-100 text-teal-800',bgBar:'bg-teal-600'}, cyan:{text:'text-cyan-600',badge:'bg-cyan-100 text-cyan-800',bgBar:'bg-cyan-600'}, violet:{text:'text-violet-600',badge:'bg-violet-100 text-violet-800',bgBar:'bg-violet-600'}, purple:{text:'text-purple-600',badge:'bg-purple-100 text-purple-800',bgBar:'bg-purple-600'}, sky:{text:'text-sky-600',badge:'bg-sky-100 text-sky-800',bgBar:'bg-sky-600'}, slate:{text:'text-slate-600',badge:'bg-slate-100 text-slate-800',bgBar:'bg-slate-600'}, lime:{text:'text-lime-600',badge:'bg-lime-100 text-lime-800',bgBar:'bg-lime-600'} };
      return s[color] || s.zinc;
    }

    init();
  </script>
</body>
</html>
